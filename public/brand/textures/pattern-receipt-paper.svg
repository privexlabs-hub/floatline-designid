<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Floatline pattern — receipt paper">
  <defs>
    <pattern id="dot" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.9" fill="#1A1410" opacity="0.08"/>
    </pattern>
    <pattern id="receipt" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M0 30 H60" stroke="#1A1410" stroke-opacity="0.06" stroke-width="1" stroke-dasharray="3 3"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" fill="#F7F2E8"/>
  <rect width="1200" height="300" fill="url(#dot)"/>
  <rect width="1200" height="300" fill="url(#receipt)"/>
</svg>
